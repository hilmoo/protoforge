version: 2

project_name: protoforge

before:
  hooks:
    - go mod tidy

builds:
  - id: protoforge
    main: ./cmd/protoforge
    binary: protoforge
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - docs/config.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
