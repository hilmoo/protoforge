syntax = "proto3";

package services.v1;
option go_package = "proto/services/v1;servicesv1";

import "models/v1/pet.proto";
import "models/v1/tag.proto";
import "models/v1/pet_kind.proto";

service PetService {
  rpc CreatePet (CreatePetRequest) returns (CreatePetResponse);

  rpc BulkTag (BulkTagRequest) returns (BulkTagResponse);

  rpc Ping (PingRequest) returns (PingResponse);

}

message CreatePetRequest {
  // path id
  string project_id = 10;
  models.v1.Pet pet = 1;
}

message CreatePetResponse {
  models.v1.Pet data = 1;
}



message BulkTagRequest {
  repeated models.v1.Tag tags = 1;
  models.v1.PetKind kind = 2;
}

message BulkTagResponse {
  repeated models.v1.Tag data = 1;
}

message PingRequest {
}

message PingResponse {
}

