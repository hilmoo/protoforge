name: ci

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "testdata/**"
      - "schema/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "testdata/**"
      - "schema/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: install sample project tools
        shell: bash
        run: |
          npm ci --prefix testdata/sample/db
          npm ci --prefix testdata/sample/api
          npm install -g @openapitools/openapi-generator-cli@2.20.2
          openapi-generator-cli version-manager set 7.25.0
      - name: vet
        run: go vet ./...
      - name: test
        # Includes the end-to-end run of testdata/sample (Drizzle, TypeSpec, openapi-generator).
        run: go test ./...
      - name: build
        run: go build ./cmd/protoforge

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/pgsql/
        env:
          PROTOFORGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean

  ci-ok:
    name: CI OK
    if: always()
    needs: [test, postgres, release-snapshot]
    runs-on: ubuntu-latest
    steps:
      - name: check results
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
